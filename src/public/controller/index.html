<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <title>Gyrocade Controller</title>
    <link rel="stylesheet" href="/controller/controller.css" />
    <script type="module" src="/controller/controller.js"></script>
  </head>
  <body>
    <main id="join-screen" class="screen">
      <h1 class="logo">GYRO<span>CADE</span></h1>
      <form id="join-form">
        <label for="name">Your name</label>
        <input id="name" maxlength="16" placeholder="Player" autocomplete="nickname" />
        <button type="submit">Start</button>
      </form>
      <p id="error" class="error" hidden></p>
    </main>

    <main id="play-screen" class="screen" hidden>
      <p id="status" class="status">Connecting…</p>
      <div id="pad" class="pad">
        <div id="dot" class="dot"></div>
      </div>
      <p id="hint" class="hint">Hold the phone upright in portrait and tilt it to move your ball.</p>
      <button id="calibrate" type="button">Recalibrate</button>
    </main>
  </body>
</html>
