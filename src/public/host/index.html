<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Gyrocade</title>
    <script>
      // iPadOS pretends to be a Mac, so the server can't send it to the controller. Macs have no touch.
      if (/Macintosh/.test(navigator.userAgent) && navigator.maxTouchPoints > 1) location.replace('/play');
    </script>
    <link rel="stylesheet" href="/shared/theme.css" />
    <link rel="stylesheet" href="/host/host.css" />
    <script type="importmap">
      {
        "imports": {
          "three": "/vendor/three/build/three.module.js",
          "three/addons/": "/vendor/three/examples/jsm/"
        }
      }
    </script>
    <script type="module" src="/host/host.js"></script>
  </head>
  <body>
    <div id="stage" class="stage">
      <!-- Nobody has joined yet: one line for the room, pointing at the panel -->
      <p id="stage-hint" class="stage-hint" data-i18n="lobby.stageHint" hidden></p>

      <!-- Everyone is ready: short countdown before the vote -->
      <div id="countdown" class="stage-overlay countdown" hidden>
        <p class="overlay-title" data-i18n="host.countdownTitle"></p>
        <div class="ring">
          <svg viewBox="0 0 100 100" aria-hidden="true">
            <circle class="ring-track" cx="50" cy="50" r="45" />
            <circle id="countdown-progress" class="ring-progress" cx="50" cy="50" r="45" pathLength="100" />
          </svg>
          <span id="countdown-number" class="ring-number"></span>
        </div>
        <p class="overlay-sub" data-i18n="host.countdownSub"></p>
      </div>

      <!-- Phones vote for the next minigame -->
      <div id="vote" class="stage-overlay vote" hidden>
        <div class="vote-head">
          <p id="vote-title" class="overlay-title"></p>
          <div class="ring ring-small">
            <svg viewBox="0 0 100 100" aria-hidden="true">
              <circle class="ring-track" cx="50" cy="50" r="45" />
              <circle id="vote-progress" class="ring-progress" cx="50" cy="50" r="45" pathLength="100" />
            </svg>
            <span id="vote-seconds" class="ring-number"></span>
          </div>
        </div>
        <div id="vote-cards" class="vote-cards"></div>
      </div>
    </div>

    <aside id="lobby" class="lobby">
      <header class="lobby-header">
        <h1 class="logo">GYRO<span>CADE</span></h1>
        <div id="lang-switch" class="lang-switch" role="group" aria-label="Language / Sprache">
          <button type="button" data-lang="en">EN</button>
          <button type="button" data-lang="de">DE</button>
        </div>
      </header>

      <section id="join-card" class="join-card">
        <h2 class="join-title" data-i18n="lobby.joinTitle"></h2>
        <div id="qr" class="qr"></div>
        <p class="or" data-i18n="lobby.orType"></p>
        <p id="join-url" class="join-url"></p>
        <p class="wifi">
          <svg class="icon-wifi" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M2 9a15 15 0 0 1 20 0M5 12.5a10 10 0 0 1 14 0M8.5 16a5 5 0 0 1 7 0" />
            <circle cx="12" cy="19.5" r="1.5" />
          </svg>
          <svg class="icon-globe" viewBox="0 0 24 24" aria-hidden="true">
            <circle class="ring" cx="12" cy="12" r="9.5" />
            <path d="M2.5 12h19M12 2.5c3 3.2 3 15.8 0 19M12 2.5c-3 3.2-3 15.8 0 19" />
          </svg>
          <span id="wifi"></span>
        </p>
        <ol class="steps">
          <li data-i18n="lobby.step1"></li>
          <li id="step2" data-i18n="lobby.step2"></li>
          <li id="step3" data-i18n="lobby.step3"></li>
        </ol>
      </section>

      <section class="players">
        <div class="players-head">
          <h2 class="players-title" data-i18n="lobby.players"></h2>
          <span id="player-count" class="player-count"></span>
          <span id="ready-count" class="ready-count"></span>
        </div>
        <p id="lobby-status" class="lobby-status" aria-live="polite"></p>
        <ul id="slots" class="slots"></ul>
      </section>

      <p class="keys" data-i18n-html="lobby.keys"></p>
    </aside>

    <!-- Q: huge QR code for players far from the screen -->
    <div id="qr-overlay" class="qr-overlay" hidden>
      <div class="qr-overlay-card">
        <div id="qr-big" class="qr"></div>
        <p id="join-url-big" class="join-url"></p>
        <p class="or" data-i18n="lobby.qrHint"></p>
      </div>
    </div>

    <div id="banner" class="banner" data-i18n="host.connecting">Connecting to server…</div>
  </body>
</html>
